name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python Tools/check_public.py
      - run: python -m unittest discover -s Tools/HandTracking -p test_bridge.py
